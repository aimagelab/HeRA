<?xml version="1.0" encoding="UTF-8"?>
<svg id="roundelSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" class="w-full max-w-[500px] h-auto drop-shadow-xl">
        <defs>
          <!-- Top text arc -->
          <path id="top-arc" d="M 120,400 A 280,280 0 0,1 680,400"/>
          <!-- Bottom text arc -->
          <path id="bottom-arc" d="M 120,400 A 280,280 0 0,0 680,400"/>
        </defs>

        <!-- Red Outer Ring -->
        <path d="M 400,40 &#10;                 A 360,360 0 1,0 400,760 &#10;                 A 360,360 0 1,0 400,40 &#10;                 M 400,180 &#10;                 A 220,220 0 1,1 400,620 &#10;                 A 220,220 0 1,1 400,180" fill="#DC241F" fill-rule="evenodd"/>

        <!-- Upper Arc Text -->
        <text fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="24.5px" letter-spacing="1.8px">
          <textPath href="#top-arc" startOffset="50%" text-anchor="middle">TOPOLOGICAL REPRESENTATION ALIGNMENT</textPath>
        </text>

        <!-- Lower Arc Text -->
        <text fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="31px" letter-spacing="2.8px">
          <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">FOR MULTIMODAL LLMS</textPath>
        </text>

        <!-- Blue Central Horizontal Bar -->
        <rect x="20" y="330" width="760" height="140" fill="#0019A8" rx="3" ry="3"/>

        <!-- Center Text -->
        <text x="400" y="400" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="78px" letter-spacing="4px" text-anchor="middle" dominant-baseline="central">MIND THE HEADS</text>
      </svg>